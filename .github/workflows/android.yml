name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Optional: keep the same signing key every build so updates install over the old app.
      # Add repo secrets KEYSTORE_BASE64 (base64 of a .jks with alias "litechat") and KEYSTORE_PASSWORD.
      - name: Prepare signing key (if secrets exist)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk LiteChat.apk
          ls -l LiteChat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiteChat-apk
          path: LiteChat.apk

      # Stable download link for your phone: Releases -> "LiteChat (latest build)"
      - name: Publish release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LiteChat.apk --target "$GITHUB_SHA" \
            --title "LiteChat (latest build)" \
            --notes "Install LiteChat.apk on your Android phone (allow 'install unknown apps' for your browser)."
